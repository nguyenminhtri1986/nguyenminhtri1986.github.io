<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin học 12 - THPT Nguyễn Bỉnh Khiêm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .dark-scroll::-webkit-scrollbar-thumb { background: #4b5563; }
        .dark-scroll::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        /* Code Editor Style */
        .editor-font { font-family: 'Fira Code', monospace; }
        
        #editor-container {
            display: flex;
            background-color: #1e1e1e;
            overflow: hidden;
            position: relative;
        }
        #line-numbers {
            padding: 1rem 0.5rem;
            text-align: right;
            color: #858585;
            background-color: #1e1e1e;
            user-select: none;
            overflow: hidden;
            min-width: 3rem;
            line-height: 1.5;
            font-size: 13px;
            border-right: 1px solid #333;
        }
        #code-editor {
            flex-grow: 1;
            padding: 1rem;
            background-color: #1e1e1e;
            color: #d4d4d4;
            outline: none;
            resize: none;
            line-height: 1.5;
            font-size: 13px;
            white-space: pre;
            overflow: auto;
            border: none;
        }
        #code-editor::selection { background: #264f78; }

        /* Vòng tròn điểm số */
        .score-circle {
            border: 2px dashed #f87171;
            color: #ef4444;
            border-radius: 50%;
            width: 4.5rem;
            height: 4.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.5rem;
            background-color: #fffafa;
            transition: all 0.3s ease;
        }
        .score-circle.perfect {
            border: 2px solid #10b981;
            color: #10b981;
            background-color: #f0fdf4;
        }
        
        /* Cây DOM */
        .dom-node {
            margin-left: 1.2rem;
            border-left: 1px dashed #cbd5e1;
            padding-left: 0.5rem;
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
        }
        .dom-tag {
            color: #2563eb;
            background: #eff6ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .dom-text {
            color: #4b5563;
            font-size: 0.85rem;
            margin-left: 0.5rem;
        }

        .hint-content {
            display: none;
        }
        .hint-content.active {
            display: block;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col lg:flex-row items-stretch p-2 gap-2 bg-[#f3f4f6]">

    <!-- Cột 1: Thông tin bài học và Tiêu chí (Rubric) -->
    <aside class="w-full lg:w-[360px] xl:w-[400px] flex flex-col bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden shrink-0 z-10">
        
        <!-- Header Bài học -->
        <div class="p-3 border-b border-gray-100 shrink-0 bg-white z-10 relative">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider">Bài 7. HTML và cấu trúc cơ bản</span>
                <span id="lesson-tag" class="text-[11px] font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded">Nhận biết</span>
            </div>
            <h2 id="lesson-title" class="text-lg font-bold text-gray-900 leading-snug mb-1.5 break-words">Tên bài học</h2>
            <div id="lesson-desc" class="text-[13px] text-gray-700 leading-relaxed space-y-1.5 break-words">
                <!-- Nội dung mô tả -->
            </div>
        </div>

        <!-- Phiếu tiêu chí (Full size) -->
        <div class="flex-1 p-3 pb-4">
            <h3 class="text-sm font-semibold text-gray-800 mb-2 flex items-center gap-2">
                Phiếu tiêu chí
            </h3>
            <ul id="criteria-list" class="space-y-2.5">
                <!-- Items render bằng JS -->
            </ul>
        </div>

        <!-- Chấm điểm & Điều hướng -->
        <div class="p-3 bg-white shrink-0 border-t border-gray-50 mt-auto">
            <!-- Nút hành động -->
            <div class="flex gap-2 mb-4">
                <button onclick="submitCode()" class="flex-1 bg-gray-900 hover:bg-black text-white py-2 rounded-lg flex items-center justify-center gap-2 text-[13px] font-semibold transition-colors shadow-sm">
                    <i class="fa-solid fa-scissors transform -rotate-90"></i> Chấm bài <span class="text-gray-400 font-normal text-[11px] ml-1 border-l border-gray-600 pl-1.5">Ctrl+↵</span>
                </button>
                <button onclick="showSubmitDialog()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg flex items-center justify-center gap-2 text-[13px] font-semibold transition-colors shadow-sm">
                    <i class="fa-solid fa-paper-plane"></i> Nộp bài
                </button>
            </div>
            
            <!-- Điểm số -->
            <div class="flex justify-center mb-2">
                <div id="score-display" class="score-circle shadow-inner !w-16 !h-16 !text-xl">0/0</div>
            </div>
            <p id="feedback-msg" class="text-[11.5px] text-red-500 text-center mb-4 min-h-[1.5rem] font-medium leading-relaxed"></p>
            
            <!-- Nút Qua câu -->
            <div class="flex items-center justify-between text-[13px] text-gray-700 font-medium border-t border-gray-100 pt-3">
                <button onclick="changeLesson(-1)" id="btn-prev" class="hover:text-blue-600 hover:bg-blue-50 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors"><i class="fa-solid fa-arrow-left"></i> Trước</button>
                <span id="lesson-counter" class="text-gray-800 font-bold bg-gray-100 px-3 py-1 rounded-full text-xs">1 / 3</span>
                <button onclick="changeLesson(1)" id="btn-next" class="hover:text-blue-600 hover:bg-blue-50 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 transition-colors">Sau <i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
    </aside>

    <!-- Cột 2: Code Editor -->
    <section class="w-full lg:flex-1 flex flex-col rounded-xl overflow-hidden bg-[#1e1e1e] border border-gray-800 shadow-xl min-h-[500px]">
        <!-- Editor Header Tabs -->
        <div class="bg-[#191919] flex items-end px-2 border-b border-gray-800 shrink-0 h-10 select-none">
            <div class="bg-[#1e1e1e] text-gray-300 hover:text-white text-xs font-medium px-4 py-2 border-t-2 border-yellow-500 h-full flex items-center gap-2 cursor-pointer transition-colors">
                <i class="fa-brands fa-html5 text-orange-500 text-sm"></i> index.html
            </div>
        </div>

        <!-- Textarea & Line numbers -->
        <div id="editor-container" class="flex-1 editor-font">
            <div id="line-numbers" class="dark-scroll">1</div>
            <textarea id="code-editor" class="dark-scroll" spellcheck="false" wrap="off"></textarea>
        </div>

        <!-- Editor Toolbar -->
        <div class="bg-[#252526] px-4 py-2 flex items-center gap-2.5 shrink-0 text-[13px] border-t border-gray-800 overflow-x-auto whitespace-nowrap">
            <button onclick="updatePreview()" class="text-gray-300 hover:text-white hover:bg-[#333333] px-2.5 py-1 rounded flex items-center gap-1.5 transition-colors">
                <i class="fa-solid fa-play text-green-500"></i> Chạy lại
            </button>
            <button onclick="copyCode(event)" class="text-gray-300 hover:text-white hover:bg-[#333333] px-2.5 py-1 rounded flex items-center gap-1.5 transition-colors">
                <i class="fa-regular fa-copy"></i> Chép mã
            </button>
            <button onclick="downloadHTML()" class="text-gray-300 hover:text-white hover:bg-[#333333] px-2.5 py-1 rounded flex items-center gap-1.5 transition-colors">
                <i class="fa-solid fa-file-arrow-down"></i> Tải mã
            </button>
            <button onclick="resetCode()" class="text-gray-300 hover:text-white hover:bg-[#333333] px-2.5 py-1 rounded flex items-center gap-1.5 transition-colors">
                <i class="fa-solid fa-rotate-left"></i> Làm lại từ đầu
            </button>
            <span class="text-gray-500 ml-auto text-[11px] hidden lg:block shrink-0">Ctrl + Enter chạy <span class="mx-2 text-gray-700">|</span> Tab thụt lề</span>
        </div>
    </section>

    <!-- Cột 3: Preview & Inspector -->
    <section class="w-full lg:w-[360px] xl:w-[400px] flex flex-col gap-2 shrink-0 overflow-hidden relative min-h-[500px]">
        
        <!-- Cửa sổ Live Preview -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col overflow-hidden">
            <!-- Trình duyệt Mockup -->
            <div class="bg-gray-50 px-3 py-2 flex items-center gap-4 border-b border-gray-200 shrink-0">
                <div class="flex gap-1.5">
                    <div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div>
                    <div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div>
                    <div class="w-3 h-3 rounded-full bg-[#27c93f]"></div>
                </div>
                
                <div class="flex-1 flex justify-center">
                    <div class="bg-gray-200/80 p-1 rounded-md flex gap-1">
                        <button id="btn-view-student" onclick="togglePreviewMode('student')" class="px-4 py-1 text-xs font-semibold bg-white shadow-sm rounded text-gray-800 transition-all">Bài làm</button>
                        <button id="btn-view-sample" onclick="togglePreviewMode('sample')" class="px-4 py-1 text-xs font-semibold text-gray-500 hover:text-gray-700 rounded transition-all"><i class="fa-solid fa-eye"></i> Mẫu</button>
                    </div>
                </div>
                
                <div class="text-[10px] text-gray-400 font-medium">Bấm vào trong để soi phần tử</div>
            </div>
            <!-- Iframe cho code -->
            <iframe id="preview-frame" class="w-full flex-1 bg-white"></iframe>
        </div>

        <!-- Cửa sổ Inspector (Cây DOM & Báo lỗi) -->
        <!-- Giảm chiều cao khung DOM từ 35% xuống 30% để nới rộng không gian cho phần xem trước Web -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 h-[30%] flex flex-col overflow-hidden shrink-0">
            <!-- Handler kéo thả mô phỏng -->
            <div class="h-1 bg-gray-100 border-b border-gray-200 w-full flex justify-center items-center">
                <div class="w-8 h-0.5 bg-gray-300 rounded-full"></div>
            </div>
            
            <div class="flex border-b border-gray-100 bg-white px-2 shrink-0 pt-1">
                <button onclick="switchTab('dom')" id="tab-btn-dom" class="px-4 py-2 text-sm font-semibold text-blue-600 border-b-2 border-blue-600">Cây DOM</button>
                <button onclick="switchTab('element')" id="tab-btn-element" class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700">Phần tử</button>
                <button onclick="switchTab('error')" id="tab-btn-error" class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700">Lỗi cú pháp</button>
            </div>
            
            <!-- Nội dung Tabs -->
            <div class="flex-1 overflow-y-auto bg-white p-4 font-mono text-sm">
                <!-- Tab Cây DOM -->
                <div id="tab-content-dom" class="block">
                    <div class="text-blue-700 font-bold mb-1 text-xs bg-blue-50 border border-blue-100 inline-block px-1.5 py-0.5 rounded shadow-sm">document</div>
                    <div id="dom-tree-container">
                        <!-- Render cây DOM ở đây -->
                    </div>
                </div>
                
                <!-- Tab Phần tử (Mock) -->
                <div id="tab-content-element" class="hidden">
                    <p class="text-gray-400 text-xs text-center mt-4 italic">Bấm vào một thẻ HTML bên trên để xem thuộc tính.</p>
                </div>

                <!-- Tab Lỗi cú pháp -->
                <div id="tab-content-error" class="hidden" id="syntax-log">
                    <p class="text-sm text-green-600 flex items-center gap-2">
                        <i class="fa-solid fa-check-circle"></i> Chưa phát hiện lỗi cú pháp nào. Mã sạch.
                    </p>
                </div>
            </div>
        </div>

        <!-- Nút Hỏi Gemini (Mock) -->
        <button class="absolute bottom-4 right-4 bg-white border border-gray-200 text-gray-700 shadow-md hover:shadow-lg px-4 py-2 rounded-full text-sm font-medium flex items-center gap-2 transition-all z-20">
            <span class="bg-gradient-to-r from-blue-500 to-purple-500 text-transparent bg-clip-text font-bold"><i class="fa-solid fa-sparkles text-purple-500"></i> Hỏi Gemini</span>
        </button>
    </section>

    <!-- Hộp thoại Modal UI (Được tối ưu lại để có thể cuộn trên điện thoại nhỏ) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center backdrop-blur-sm transition-opacity p-3 md:p-5">
        <div class="bg-white rounded-xl shadow-2xl w-[450px] max-w-full max-h-full flex flex-col overflow-hidden transform transition-transform">
            <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between bg-gray-50/50 shrink-0">
                <h3 id="modal-title-text" class="font-bold text-gray-800 text-lg">Thông báo</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <!-- Bổ sung overflow-y-auto để nội dung không bao giờ bị tràn ra ngoài nếu màn hình quá lùn -->
            <div id="modal-body" class="p-5 text-gray-600 overflow-y-auto overscroll-contain">
                <!-- Nội dung sẽ được chèn động bằng JavaScript -->
            </div>
            <div id="modal-footer" class="px-5 py-3 bg-gray-50 flex justify-end gap-2 border-t border-gray-100 shrink-0">
               <!-- Nút bấm sẽ được chèn động bằng JavaScript -->
            </div>
        </div>
    </div>

    <!-- JavaScript Xử Lý -->
    <script>
        // --- 1. DỮ LIỆU BÀI HỌC THEO PHIẾU BÀI TẬP ---
        const lessons = [
            {
                id: 1,
                title: "Câu 1: Khởi tạo trang web đầu tiên",
                tag: "Nhận biết",
                description: `
                    <p class="mb-2 text-[13px]">Soạn thảo cấu trúc HTML chuẩn và các thẻ cơ bản theo yêu cầu. Khuyến khích gõ <b>Tiếng Việt có dấu</b>.</p>
                    <div class="bg-blue-50 border border-blue-100 p-2.5 rounded-lg text-xs text-blue-800 mb-3">
                        <strong>💡 Các bước thực hiện:</strong>
                        <ul class="list-decimal pl-5 mt-1.5 space-y-1">
                            <li>Khai báo <code>&lt;!DOCTYPE html&gt;</code></li>
                            <li>Mở thẻ <code>&lt;html lang="vi"&gt;</code></li>
                            <li>Phần <code>&lt;head&gt;</code> chứa <code>&lt;meta charset="UTF-8"&gt;</code> và <code>&lt;title&gt;Trang web của tôi&lt;/title&gt;</code></li>
                            <li>Phần <code>&lt;body&gt;</code> chứa nội dung:
                                <ul class="list-disc pl-4 mt-1 text-gray-700">
                                    <li>Thẻ <code>&lt;h1&gt;</code>: Chào mừng đến với HTML!</li>
                                    <li>Thẻ <code>&lt;p&gt;</code>: Đây là trang web đầu tiên của em.</li>
                                </ul>
                            </li>
                            <li>Đóng thẻ <code>&lt;/html&gt;</code> ở cuối cùng.</li>
                        </ul>
                    </div>
                `,
                initialCode: ``,
                sampleCode: `<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>Trang web của tôi</title>
    </head>
    <body>
        <h1>Chào mừng đến với HTML!</h1>
        <p>Đây là trang web đầu tiên của em.</p>
    </body>
</html>`,
                criteria: [
                    {
                        title: 'Có cấu trúc chuẩn: <code class="text-blue-600">&lt;!DOCTYPE html&gt;</code>, <code class="text-blue-600">&lt;html&gt;</code>, <code class="text-blue-600">&lt;head&gt;</code>, <code class="text-blue-600">&lt;body&gt;</code>',
                        hint: "Hãy đảm bảo bạn đã gõ đúng chính tả <code>&lt;!DOCTYPE html&gt;</code> ở dòng 1 và có đủ thẻ đóng mở cho html, head, body.",
                        validate: (doc, code) => {
                            let c = code.toLowerCase();
                            if (c.includes("<!doctype html>") && c.includes("<html") && c.includes("</html>") && c.includes("<head>") && c.includes("</head>") && c.includes("<body>") && c.includes("</body>")) {
                                return { pass: true };
                            }
                            return { pass: false, error: "Thiếu hoặc sai cấu trúc chuẩn." };
                        }
                    },
                    {
                        title: 'Có thẻ <code class="text-blue-600">&lt;title&gt;</code> với nội dung "Trang web của tôi"',
                        hint: "Trong cặp thẻ <code>&lt;head&gt;</code>, thêm dòng: <code>&lt;title&gt;Trang web của tôi&lt;/title&gt;</code>",
                        validate: (doc, code) => {
                            let title = doc.querySelector('title');
                            let text = title ? title.innerText.toLowerCase() : '';
                            if (text.includes("trang web của tôi") || text.includes("trang web cua toi")) return { pass: true };
                            return { pass: false, error: "Chưa có thẻ title hoặc sai nội dung." };
                        }
                    },
                    {
                        title: 'Có thẻ <code class="text-blue-600">&lt;h1&gt;</code> với nội dung "Chào mừng đến với HTML!"',
                        hint: "Trong cặp thẻ <code>&lt;body&gt;</code>, thêm dòng: <code>&lt;h1&gt;Chào mừng đến với HTML!&lt;/h1&gt;</code>",
                        validate: (doc, code) => {
                            let h1 = doc.querySelector('h1');
                            let text = h1 ? h1.innerText.toLowerCase() : '';
                            if (text.includes("chào mừng đến với html") || text.includes("chao mung den voi html")) return { pass: true };
                            return { pass: false, error: "Chưa có thẻ h1 hoặc sai nội dung." };
                        }
                    },
                    {
                        title: 'Có thẻ <code class="text-blue-600">&lt;p&gt;</code> với nội dung "Đây là trang web đầu tiên của em."',
                        hint: "Ngay dưới thẻ h1, thêm: <code>&lt;p&gt;Đây là trang web đầu tiên của em.&lt;/p&gt;</code>",
                        validate: (doc, code) => {
                            let p = doc.querySelector('p');
                            let text = p ? p.innerText.toLowerCase() : '';
                            if (text.includes("đây là trang web đầu tiên") || text.includes("day la trang web dau tien")) return { pass: true };
                            return { pass: false, error: "Chưa có thẻ p hoặc sai nội dung." };
                        }
                    }
                ]
            },
            {
                id: 2,
                title: "Câu 2: Gỡ lỗi và hoàn thiện mã",
                tag: "Thông hiểu",
                description: `
                    <p class="mb-2 text-[13px] text-gray-700">Đoạn mã bên phải đang bị thiếu một số thẻ đóng và sai cấu trúc. Hãy tìm và sửa lỗi trực tiếp.</p>
                    <div class="bg-yellow-50 border border-yellow-100 p-2.5 rounded-lg text-xs text-yellow-800">
                        <strong>💡 Gợi ý các lỗi cần sửa:</strong>
                        <ul class="list-decimal pl-5 mt-1.5 space-y-1">
                            <li>Thẻ <code>&lt;title&gt;</code> chưa được đóng.</li>
                            <li>Thẻ <code>&lt;h1&gt;</code> chưa được đóng.</li>
                            <li>Thiếu thẻ đóng <code>&lt;/body&gt;</code> ở cuối.</li>
                            <li>Thiếu thẻ đóng <code>&lt;/html&gt;</code> ở cuối.</li>
                        </ul>
                    </div>
                `,
                initialCode: `<html>
<head>
    <title>Hồ sơ học sinh
</head>
<body>
    <h1>Thông tin cá nhân
    
    <p>Họ và tên: Nguyễn Văn A</p>
`,
                sampleCode: `<html>
<head>
    <!-- Đã đóng thẻ title -->
    <title>Hồ sơ học sinh</title>
</head>
<body>
    <!-- Đã đóng thẻ h1 -->
    <h1>Thông tin cá nhân</h1>
    
    <p>Họ và tên: Nguyễn Văn A</p>

<!-- Đã đóng thẻ body và html -->
</body>
</html>`,
                criteria: [
                    {
                        title: 'Đã đóng thẻ <code class="text-blue-600">&lt;/title&gt;</code>',
                        hint: "Sửa lại thành: <code>&lt;title&gt;Hồ sơ học sinh&lt;/title&gt;</code>",
                        validate: (doc, code) => {
                            if (code.toLowerCase().includes("</title>")) return { pass: true };
                            return { pass: false, error: "Bạn chưa gõ thẻ đóng &lt;/title&gt;" };
                        }
                    },
                    {
                        title: 'Đã đóng thẻ <code class="text-blue-600">&lt;/h1&gt;</code>',
                        hint: "Sửa lại thành: <code>&lt;h1&gt;Thông tin cá nhân&lt;/h1&gt;</code>",
                        validate: (doc, code) => {
                            if (code.toLowerCase().includes("</h1>")) return { pass: true };
                            return { pass: false, error: "Bạn chưa gõ thẻ đóng &lt;/h1&gt;" };
                        }
                    },
                    {
                        title: 'Đã đóng thẻ <code class="text-blue-600">&lt;/body&gt;</code> và <code class="text-blue-600">&lt;/html&gt;</code>',

                criteria: [

        ];

        // --- 2. BIẾN TRẠNG THÁI ---
        let currentIndex = 0;
        let currentPreviewMode = 'student';
        let lastSubmittedCode = ''; // Biến lưu tạm mã nguồn vừa nộp
        
        // --- 3. DOM ELEMENTS ---

        // --- 4. LOGIC EDITOR & PREVIEW ---
        function updateLineNumbers() {
            const lines = editor.value.split('\n').length;
            lineNumbers.innerHTML = Array(lines).fill(0).map((_, i) => i + 1).join('<br>');
        }

        editor.addEventListener('input', () => {
            updateLineNumbers();
            updatePreview(); 
        });
        
        editor.addEventListener('scroll', () => {
            lineNumbers.scrollTop = editor.scrollTop;
        });

        editor.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                updateLineNumbers();
                updatePreview();
            }
            if (e.ctrlKey && e.key === 'Enter') {
                submitCode();
            }
        });

        function updatePreview() {
            // Lưu lại toàn bộ mã nguồn học sinh đang viết dở vào dữ liệu bài học
            lessons[currentIndex].userCode = editor.value;

            // Tự động chuyển về giao diện "Bài làm" nếu học sinh đang gõ code
            if (currentPreviewMode === 'sample') {
                togglePreviewMode('student');
            } else {
                const code = editor.value;
                previewFrame.srcdoc = code;
            }
        }

        previewFrame.onload = () => {
            updateDOMTree();
        };

        // Vẽ cây DOM đệ quy
        function updateDOMTree() {
            const container = document.getElementById('dom-tree-container');
            if (!container) return;
            container.innerHTML = '';
            
            try {
                const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
                
                function buildNode(el) {
                    const div = document.createElement('div');
                    div.className = 'dom-node';
                    
                    const tagSpan = document.createElement('span');
                    tagSpan.className = 'dom-tag';
                    tagSpan.innerText = el.tagName.toLowerCase();
                    div.appendChild(tagSpan);
                    
                    // Nếu là thẻ text đơn giản (title, h1, p) thì in ra text content
                    if (['title', 'h1', 'h2', 'h3', 'p', 'span'].includes(el.tagName.toLowerCase())) {
                        const textNode = document.createElement('span');
                        textNode.className = 'dom-text truncate inline-block max-w-[200px] align-bottom';
                        textNode.innerText = `"${el.innerText.substring(0, 30)}${el.innerText.length > 30 ? '...' : ''}"`;
                        if(el.innerText.trim().length > 0) div.appendChild(textNode);
                    }
                    
                    Array.from(el.children).forEach(child => {
                        div.appendChild(buildNode(child));
                    });
                    
                    return div;
                }
                
                if (doc.documentElement) {
                    container.appendChild(buildNode(doc.documentElement));
                }
            } catch (e) {
                container.innerHTML = '<span class="text-gray-400 text-xs">Không thể phân tích cây DOM.</span>';
            }
        }

        // --- 5. LOGIC BÀI HỌC VÀ CHẤM ĐIỂM ---
        function loadLesson(index) {
            const lesson = lessons[index];
            document.getElementById('lesson-tag').innerText = lesson.tag;
            document.getElementById('lesson-title').innerText = lesson.title;
            document.getElementById('lesson-desc').innerHTML = lesson.description;
            document.getElementById('lesson-counter').innerText = `${index + 1} / ${lessons.length}`;
            
            // Xử lý nút điều hướng
            document.getElementById('btn-prev').style.visibility = index === 0 ? 'hidden' : 'visible';
            document.getElementById('btn-next').style.visibility = index === lessons.length - 1 ? 'hidden' : 'visible';

            // Khôi phục mã nguồn đã lưu nếu học sinh đã từng gõ, nếu không thì lấy mã khởi tạo
            editor.value = lesson.userCode !== undefined ? lesson.userCode : lesson.initialCode;
            
            // Khôi phục lại chế độ xem Bài làm
            togglePreviewMode('student');
            updateLineNumbers();
            updatePreview();
            
            criteriaList.innerHTML = '';
            lesson.criteria.forEach((crit, i) => {
                const li = document.createElement('li');
                li.id = `crit-${i}`;
                li.className = "flex items-start gap-2 pb-1";
                
                li.innerHTML = `
                    <div class="mt-[2px] icon-box w-3.5 h-3.5 flex items-center justify-center flex-shrink-0 text-gray-300 font-bold text-[10px]">
                        <i class="fa-solid fa-minus"></i>
                    </div>
                    <!-- Thêm min-w-0 để ngăn chữ trong flexbox làm tràn viền -->
                    <div class="flex-1 min-w-0">
                        <p class="text-[12.5px] font-medium text-gray-700 crit-title leading-snug break-words">${crit.title}</p>
                        <div class="err-container hidden mt-1">
                            <p class="text-[11.5px] text-red-500 err-msg break-words"></p>
                            <button onclick="toggleHint(${i})" class="text-[11.5px] text-blue-600 hover:underline mt-0.5 inline-block">Xem gợi ý</button>
                            <div id="hint-${i}" class="hint-content bg-blue-50 border border-blue-100 p-2 rounded text-[11.5px] text-blue-800 mt-1 break-words">
                                ${crit.hint}
                            </div>
                        </div>
                    </div>
                `;
                criteriaList.appendChild(li);
            });

            // Reset score
            scoreDisplay.innerText = `0/${lesson.criteria.length}`;
            scoreDisplay.className = 'score-circle shadow-inner';
            feedbackMsg.innerText = '';
        }

        function toggleHint(index) {
            const hintBox = document.getElementById(`hint-${index}`);
            hintBox.classList.toggle('active');
        }

        function submitCode() {
            const code = editor.value;
            const lesson = lessons[currentIndex];
            const parser = new DOMParser();
            const doc = parser.parseFromString(code, 'text/html');
            
            let passedCount = 0;
            const total = lesson.criteria.length;

            lesson.criteria.forEach((crit, i) => {
                const result = crit.validate(doc, code);
                const li = document.getElementById(`crit-${i}`);
                const iconBox = li.querySelector('.icon-box');
                const titleText = li.querySelector('.crit-title');
                const errContainer = li.querySelector('.err-container');
                const errMsg = li.querySelector('.err-msg');

                if (result.pass) {
                    passedCount++;
                    iconBox.innerHTML = '<i class="fa-solid fa-check text-green-500"></i>';
                    titleText.classList.remove('text-red-600', 'text-gray-700');
                    titleText.classList.add('text-green-700');
                    errContainer.classList.add('hidden');
                } else {
                    iconBox.innerHTML = '<i class="fa-solid fa-xmark text-red-500"></i>';
                    titleText.classList.add('text-red-600');
                    titleText.classList.remove('text-gray-700', 'text-green-700');
                    errContainer.classList.remove('hidden');
                    errMsg.innerHTML = result.error;
                }
            });

            // Cập nhật điểm
            scoreDisplay.innerText = `${passedCount}/${total}`;
            if (passedCount === total) {
                scoreDisplay.className = 'score-circle perfect shadow-sm';
                feedbackMsg.innerHTML = '<span class="text-green-600"><i class="fa-solid fa-party-horn"></i> Hoàn thành xuất sắc!</span>';
            } else {
                scoreDisplay.className = 'score-circle shadow-inner'; 
                feedbackMsg.innerHTML = `Còn <span class="font-bold">${total - passedCount}</span> tiêu chí chưa đạt.<br/>Đọc dòng nhận xét màu đỏ.`;
            }
        }

        // --- 6. CÁC HÀM TIỆN ÍCH ---
        function switchTab(tabName) {
            ['dom', 'element', 'error'].forEach(t => {
                document.getElementById(`tab-content-${t}`).classList.add('hidden');
                document.getElementById(`tab-btn-${t}`).className = 'px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-700 transition-colors';
            });
            document.getElementById(`tab-content-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tabName}`).className = 'px-4 py-2 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 transition-colors';
        }

            const btnSample = document.getElementById('btn-view-sample');

            if (mode === 'student') {
                btnStudent.className = 'px-4 py-1 text-xs font-semibold bg-white shadow-sm rounded text-gray-800 transition-all';

                btnSample.className = 'px-4 py-1 text-xs font-semibold bg-white shadow-sm rounded text-blue-600 transition-all cursor-pointer';

                previewFrame.srcdoc = lessons[currentIndex].sampleCode;

        function changeLesson(dir) {
            const newIndex = currentIndex + dir;
            if (newIndex >= 0 && newIndex < lessons.length) {
                currentIndex = newIndex;

        // HỆ THỐNG MODAL (Thay thế window.confirm mặc định và phục vụ form Nộp bài)
        function showModal(title, bodyHtml, footerHtml) {
            document.getElementById('modal-title-text').innerText = title;

            document.getElementById('modal-footer').innerHTML = footerHtml;

            showModal(

                `<button onclick="closeModal()" class="px-4 py-2 text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 text-sm font-medium transition-colors">Hủy</button>

        // HỆ THỐNG NỘP BÀI (HIỂN THỊ KẾT QUẢ TỪNG CÂU)
        function showSubmitDialog() {
            const lesson = lessons[currentIndex];
            // Lấy tên câu ngắn gọn gọn để hiển thị trên tiêu đề
            const shortTitle = lesson.title.split(':')[0]; 
            const fullTitle = "Bài 7 - " + shortTitle; // Thêm tên Bài phía trước

            showModal(
                "Nộp bài - " + fullTitle,
                `<div>
                    <div class="bg-blue-50 text-blue-800 text-sm p-3 rounded-lg border border-blue-100 mb-4">

                </div>`,
                `<button onclick="closeModal()" class="px-4 py-2 text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 text-sm font-medium transition-colors">Hủy</button>
                 <button onclick="processSubmit()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm font-medium transition-colors flex items-center gap-2"><i class="fa-solid fa-check-to-slot"></i> Nộp & Xem kết quả</button>`
            );
        }

        function processSubmit() {
            const name = document.getElementById('student-name').value.trim();
            const className = document.getElementById('student-class').value.trim();
            const stt = document.getElementById('student-stt').value.trim();
            
            // Bắt buộc nhập đầy đủ
            if (!name || !className || !stt) {
                document.getElementById('submit-error').classList.remove('hidden');
                return;
            }

            const lesson = lessons[currentIndex];
            const code = editor.value;
            
            // LƯU LẠI MÃ ĐỂ HỌC SINH TẢI VỀ SAU KHI NỘP (DÙ CHO EDITOR BỊ RESET)
            window.lastSubmittedCode = code; 

            const parser = new DOMParser();
            const doc = parser.parseFromString(code, 'text/html');
            
            let passed = 0;
            lesson.criteria.forEach(crit => {
                if (crit.validate(doc, code).pass) { passed++; }
            });
            
            const total = lesson.criteria.length;
            // Tiêu chí đã được quy đổi sang điểm hệ số 10 tại đây
            const score10 = ((passed / total) * 10).toFixed(1); 

            let feedbackIcon = passed === total 
                ? '<i class="fa-solid fa-circle-check text-5xl text-green-500 mb-3 drop-shadow-sm"></i>' 
                : '<i class="fa-solid fa-star-half-stroke text-5xl text-yellow-500 mb-3 drop-shadow-sm"></i>';
                
            let feedbackText = passed === total 
                ? "Xuất sắc! Em đã hoàn thành tất cả tiêu chí." 
                : `Em đã đạt ${passed}/${total} tiêu chí. Hãy cố gắng hoàn thiện các lỗi màu đỏ nhé!`;

            const shortTitle = lesson.title.split(':')[0]; 
            const fullTitle = "Bài 7 - " + shortTitle; // Thêm tên Bài phía trước

            // THAY ĐỔI ĐƯỜNG LINK WEB APP CỦA BẠN VÀO ĐÂY SAU KHI LÀM PHẦN 2
            const scriptUrl = 'https://script.google.com/macros/s/AKfycbzD-2I8qdXBAJiIT0gxyz6hfOdtLXFU9vQ34OFSIowXtvkypQDIe7tNmaXm8CF1K71Xug/exec'; 
            
            // Đổi trạng thái nút thành đang xử lý
            const submitBtn = document.querySelector('#custom-modal button.bg-blue-600');
            if (submitBtn) {
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu điểm...';
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            }

            // Gói dữ liệu chuẩn bị gửi lên CSDL (Google Sheet)
            const payload = {
                name: name,
                className: className,
                stt: stt, // STT đã được lấy từ form
                lessonTitle: fullTitle, 
                passed: passed,
                total: total,
                score: score10 // Gửi điểm hệ số 10
            };

            // Nếu chưa có link thật (vẫn là text mặc định), hiện kết quả ngay mà không gửi dữ liệu
            if(scriptUrl === 'YOUR_GOOGLE_SCRIPT_URL') {
                 showResultModal(name, className, stt, fullTitle, passed, total, score10, feedbackIcon, feedbackText);
                 resetAfterSubmit(); // Trả trình soạn thảo về mặc định
                 return;
            }

            // Gửi dữ liệu lên Google Sheet
            fetch(scriptUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // Dùng text/plain để tránh lỗi CORS
                body: JSON.stringify(payload)
            })
            .then(response => {
                // Đã lưu thành công
                showResultModal(name, className, stt, fullTitle, passed, total, score10, feedbackIcon, feedbackText, true);
                resetAfterSubmit(); // Trả trình soạn thảo về mặc định
            })
            .catch(error => {
                // Báo lỗi nếu không lưu được
                console.error('Lỗi khi gửi lên Sheet:', error);
                showResultModal(name, className, stt, fullTitle, passed, total, score10, feedbackIcon, feedbackText, false);
                resetAfterSubmit(); // Trả trình soạn thảo về mặc định
            });
        }

        // Hàm xóa mã nguồn và reset câu hỏi ngay sau khi nộp
        function resetAfterSubmit() {
            lessons[currentIndex].userCode = lessons[currentIndex].initialCode;
            editor.value = lessons[currentIndex].initialCode;
            updateLineNumbers();
            updatePreview();
            loadLesson(currentIndex); 
        }

        // Hàm tách riêng việc hiển thị Modal Kết Quả để tái sử dụng
        function showResultModal(name, className, stt, lessonTitle, passed, total, score10, feedbackIcon, feedbackText, isSaved = null) {
            closeModal(); // Tắt popup nhập tên

            // Trạng thái thông báo lưu
            let saveStatus = '';
            if (isSaved === true) {
                saveStatus = '<div class="text-xs text-green-600 font-semibold mb-2 bg-green-50 border border-green-200 py-1.5 px-3 rounded-full inline-flex items-center gap-1.5"><i class="fa-solid fa-cloud-arrow-up"></i> Đã lưu điểm lên hệ thống CSDL</div>';
            } else if (isSaved === false) {
                saveStatus = '<div class="text-xs text-red-500 font-semibold mb-2 bg-red-50 border border-red-200 py-1.5 px-3 rounded-full inline-flex items-center gap-1.5"><i class="fa-solid fa-triangle-exclamation"></i> Không thể lưu, vui lòng chụp màn hình báo cho GV</div>';
            }

            setTimeout(() => {
                showModal(
                    "Kết quả nộp bài",
                    `<div class="text-center py-2">
                        ${feedbackIcon}
                        <h4 class="text-xl font-bold text-gray-800 mb-1">${name} - Lớp ${className} (STT: ${stt})</h4>
                        <p class="text-gray-600 font-medium text-sm mb-3 border-b border-gray-100 pb-4 px-2 leading-relaxed">${lessonTitle}</p>
                        ${saveStatus}
                        
                        <div class="bg-gray-50 border border-gray-200 rounded-xl p-4 text-left shadow-sm mt-1">
                            <div class="flex justify-between items-center mb-3 pb-3 border-b border-gray-200/60">
                                <span class="text-sm font-medium text-gray-600">Số tiêu chí hoàn thành:</span>
                                <span class="font-bold text-gray-800 text-base">${passed} / ${total}</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-medium text-gray-600">Điểm (Thang 10):</span>
                                <span class="font-black text-blue-600 text-xl">${score10}</span>
                            </div>
                        </div>
                        <p class="text-sm text-gray-500 mt-4 italic">${feedbackText}</p>
                    </div>`,
                    `<div class="flex flex-col gap-2 w-full">
                        <div class="flex gap-2 w-full">
                            <button onclick="downloadProduct('${name}', '${className}', '${stt}', '${lessonTitle}')" class="px-4 py-2 bg-orange-50 text-orange-700 border border-orange-200 rounded-lg hover:bg-orange-100 text-[13px] font-medium transition-colors flex-1 flex items-center justify-center gap-1.5"><i class="fa-brands fa-html5 text-orange-600 text-lg"></i> Tải Web (.html)</button>
                            <button onclick="downloadResult('${name}', '${className}', '${stt}', '${lessonTitle}', ${passed}, ${total}, ${score10})" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-[13px] font-medium transition-colors flex-1 flex items-center justify-center gap-1.5"><i class="fa-solid fa-file-lines text-lg"></i> Tải Phiếu (.txt)</button>
                        </div>
                        <button onclick="closeModal()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm font-medium transition-colors w-full mt-1">Đóng cửa sổ</button>
                    </div>`
                );
            }, 300);
        }

        function copyCode(event) {
            const code = editor.value;
            // Xử lý copy an toàn
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                const btn = event.currentTarget;
                const originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check text-green-500"></i> Đã chép';
                setTimeout(() => { btn.innerHTML = originalHtml; }, 2000);
            } catch (err) {
                console.error('Không thể chép mã', err);
            }
            document.body.removeChild(textArea);
        }

        function downloadHTML() {
            const code = editor.value;
            const lesson = lessons[currentIndex];
            const shortTitle = lesson.title.split(':')[0].replace(/ /g, '_'); 
            const filename = `Bai7_${shortTitle}.html`;
            
            const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadProduct(name, className, stt, lessonTitle) {
            // Lấy mã nguồn học sinh vừa nộp để xuất file, nếu lỗi thì lấy code hiện tại trên editor
            const code = window.lastSubmittedCode || editor.value; 
            
            // Xử lý chuỗi tên để làm tên file sạch sẽ (xóa khoảng trắng, dấu gạch nối dư)
            const cleanTitle = lessonTitle.replace(/ /g, '').replace(/-/g, '_'); 
            const cleanName = name.replace(/ /g, '_');
            
            const filename = `SanPham_${className}_STT${stt}_${cleanName}_${cleanTitle}.html`;
            const blob = new Blob([code], { type: 'text/html;charset=utf-8' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function downloadResult(name, className, stt, lessonTitle, passed, total, score10) {
            const lesson = lessons[currentIndex];
            const content = `KẾT QUẢ THỰC HÀNH TIN HỌC 12\n==============================\n\nSTT: ${stt}\nHọ và tên: ${name}\nLớp: ${className}\n\nTên bài: Bài 7 - HTML và cấu trúc trang web cơ bản\nCâu hỏi: ${lesson.title}\n\nSố tiêu chí hoàn thành: ${passed} / ${total}\nĐiểm (Thang 10): ${score10}\n\nThời gian nộp: ${new Date().toLocaleString('vi-VN')}`;
            
            const cleanTitle = lessonTitle.replace(/ /g, '').replace(/-/g, '_');
            const filename = `KetQua_${className}_STT${stt}_${name.replace(/ /g, '_')}_${cleanTitle}.txt`;
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Khởi tạo chạy lần đầu
        window.onload = () => {
            loadLesson(0);
        };
    </script>
</body>
</html>
